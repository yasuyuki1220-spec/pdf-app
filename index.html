<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まりもの大冒険">
<meta name="theme-color" content="#c3ecee">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<title>まりもの大冒険</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: a lake-side game shell. One committed light look: mint water, moss green, warm wood for the collection shelf. */
:root{--ink:#173A3A;--sub:#4f7f78;--moss:#2f9a7a;--moss-d:#1c6b5c;--card:#F5FFFAe6;--line:#cdeee3;--wood:#b9824f;--wood-d:#8a5a2f;--gold:#FFD76A;--gold-d:#d9a520;--warm:#FF9FB9;--mint:#73D6B0;--aqua:#6BD8E8;--pink:#FF9FB9;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;color:var(--ink);font-family:var(--round);background:radial-gradient(ellipse at 50% 0%,#F5FFFA 0,#dcf6ee 50%,#c3ecee 100%) fixed;background-color:#dcf6ee;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
@media (display-mode:standalone){.wrap{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(40px + env(safe-area-inset-bottom))}}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:22px;font-weight:900;color:var(--moss-d)}
.pbtn{border:0;border-radius:14px;padding:10px 16px;background:#fff;color:#1b654b;font-weight:700;box-shadow:0 3px 0 #b9dccc}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b9dccc}
.pbtn.main{background:linear-gradient(135deg,var(--mint),var(--aqua));color:var(--ink);box-shadow:0 4px 0 #3c9f86}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid #fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;box-shadow:0 3px 10px #2674550f}
.chip b{font-variant-numeric:tabular-nums}

/* title */
#s-title .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:28px 10px}
.logo-sub{margin:0;color:var(--sub);font-weight:700;letter-spacing:.08em;font-size:13px}
.logo{position:relative;display:inline-block;margin:6px 0 4px;font-size:clamp(46px,9vw,78px);font-weight:900;line-height:1.02;letter-spacing:.02em;filter:drop-shadow(0 5px 0 #4a2c10) drop-shadow(0 8px 10px #0003)}
.logo span{position:relative;display:block;color:#5a3418;-webkit-text-stroke:.16em #5a3418}
.logo span::after{content:attr(data-t);position:absolute;left:0;top:0;-webkit-text-stroke:0;-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .l1::after{background-image:linear-gradient(180deg,#f0ff9a 0%,#9be05a 45%,#3fa83a 100%)}
.logo .l2{font-size:1.05em;letter-spacing:.06em}
.logo .l2::after{background-image:linear-gradient(180deg,#fff8b0 0%,#ffd23f 50%,#ff9a2a 100%)}
.logo .leaf{position:absolute;width:.42em;height:.22em;background:linear-gradient(135deg,#9be66a,#2f9a4a);border-radius:100% 0;border:3px solid #2a5a1a}
.logo .leaf.a{left:-.18em;top:.05em;transform:rotate(-30deg)}.logo .leaf.b{right:-.25em;bottom:.15em;transform:rotate(150deg)}
.rank{display:inline-block;margin-top:8px;background:#fff6d6;border:2px solid var(--gold);color:#8a5a00;border-radius:999px;padding:4px 14px;font-weight:900;font-size:14px}
#t-hero{aspect-ratio:1;max-width:340px;width:100%;justify-self:center;border-radius:50%;background:radial-gradient(circle at 50% 60%,#ffffffcc,#ffffff00 70%)}
#t-hero canvas,.jpic canvas,.ipic canvas,#dd-pic canvas,.r-newc canvas{display:block;width:100%;height:auto}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.menu button{border:0;border-radius:20px;padding:18px 14px;text-align:left;background:var(--card);box-shadow:0 5px 0 #b9dccc;display:flex;flex-direction:column;gap:4px;min-width:0}
.menu button:active{transform:translateY(3px);box-shadow:0 2px 0 #b9dccc}
.menu b{font-size:20px;font-weight:900}
.menu span{font-size:13px;color:var(--sub)}
.menu .go{background:linear-gradient(180deg,#7fe08a 0%,#3fb85a 55%,#2f9a4a 100%);color:#fff;box-shadow:0 5px 0 #1f6e34,inset 0 3px 0 #ffffff66;text-shadow:0 2px 0 #1f6e3488}
.menu .go span{color:#eaffef}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* map */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;border:0;border-radius:14px;padding:8px 14px;background:#ffffffaa;display:flex;flex-direction:column;align-items:flex-start;min-width:120px;box-shadow:0 3px 0 #b9dccc}
.tab b{font-size:12px;color:var(--sub)}
.tab span{font-weight:900;font-size:15px}
.tab.on{background:#fff;box-shadow:0 3px 0 var(--moss);outline:2px solid var(--moss)}
.tab.lock span{color:#9aa9a4;font-size:13px}
.wtitle{margin:14px 0 2px;font-size:26px;font-weight:900;color:var(--moss-d)}
.wnote{margin:0 0 12px;color:var(--sub);font-size:13px;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.course{border:0;border-radius:16px;background:#fff;padding:12px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:0 4px 0 color-mix(in srgb,var(--wc) 55%,#fff);border-top:6px solid var(--wc);min-width:0}
.course:active{transform:translateY(2px)}
.course.lock{opacity:.5;cursor:not-allowed;box-shadow:none;border-top-color:#c9d6d1}
.cno{font-size:13px;font-weight:900;color:var(--wc)}
.cname{font-weight:900;font-size:15px;line-height:1.3;min-height:2.6em}
.cstars i{font-style:normal;color:#d5ddda;font-size:18px}.cstars i.on{color:var(--gold);text-shadow:0 1px 0 var(--gold-d)}
.cbest{font-size:11.5px;color:var(--sub)}

/* play */
#s-play:not([hidden]){position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#173A3A;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#s-play .bar{display:none}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;background:#173A3A}
#stage>*{flex:1;min-height:0;display:flex;flex-direction:column;background:transparent}
#stage .nc-body{flex:1;min-height:0;width:100%;max-width:none;padding:0;gap:0}
#stage .nc-view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;box-shadow:none;background:#173A3A}
#stage .nc-cv{flex:none;max-width:100%;max-height:100%}
#stage .nc-keys{flex:none;max-width:none;margin:0;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:#21504a}
#stage .nc-keys>div{display:flex;gap:12px;align-items:center}
#stage .nc-keys .nc-mini{min-width:76px;min-height:68px;font-size:26px}
#stage .nc-keys .nc-jump{min-width:120px;font-size:20px}
@media (orientation:landscape) and (max-height:560px){
 #s-play:not([hidden]){background:#21504a}
 #stage .nc-body{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;grid-template-rows:minmax(0,1fr)}
 #stage .nc-view{grid-column:2;grid-row:1}
 #stage .nc-keys{display:contents}
 #stage .nc-keys>div{grid-row:1;align-self:end;justify-content:center;padding:0 8px calc(18px + env(safe-area-inset-bottom));background:transparent}
 #stage .nc-keys>div:first-child{grid-column:1;gap:10px}
 #stage .nc-keys>div:last-child{grid-column:3;flex-direction:column;gap:10px}
 #stage .nc-keys .nc-mini{min-width:62px;min-height:70px}
 #stage .nc-keys .nc-jump{width:110px;min-width:0;height:110px;border-radius:50%}
}
.result{position:fixed;inset:0;background:rgba(12,40,40,.55);display:grid;place-items:center;padding:16px;z-index:50}
.result[hidden]{display:none}
.rcard{background:#fff;border-radius:24px;padding:22px;width:min(100%,460px);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 50px #0b2f2a55}
.rcard h3{margin:0;font-size:30px;font-weight:900;color:var(--moss-d)}
.rcard .rsub{margin:4px 0 0;color:var(--warm);font-weight:900;min-height:1.4em}
.rstars{font-size:46px;letter-spacing:6px;margin:6px 0}
.rstars i{font-style:normal;color:#e2e8e6;display:inline-block}
.rstars i.on{color:var(--gold);text-shadow:0 2px 0 var(--gold-d);animation:pop .5s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.rnums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.rnums div{background:#f0faf5;border-radius:14px;padding:8px}
.rnums span{display:block;font-size:11px;color:var(--sub);font-weight:700}
.rnums b{font-size:20px;font-variant-numeric:tabular-nums}
.r-newt{margin:4px 0;font-weight:900;color:#d4547f}
.rimg{border-radius:10px;overflow:hidden}
.r-newrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.r-newc{width:90px;font-size:12px;font-weight:700}
.rbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){.rstars i.on{animation:none}}

/* collection shelf */
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:14px 12px 0;background:linear-gradient(#f3e3c9,#ead2ad);border-radius:12px 12px 0 0;margin-top:14px;position:relative}
.shelf::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-14px;height:16px;background:linear-gradient(var(--wood),var(--wood-d));border-radius:4px;box-shadow:0 6px 10px #5a3a1a44}
.shelf+.shelf{margin-top:30px}
.jar{border:0;background:linear-gradient(180deg,#ffffffcc,#e9fbf5aa);border-radius:22px 22px 12px 12px;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 0 0 2px #ffffff,inset 0 -8px 0 #d5efe6;min-width:0;margin-bottom:14px}
.jar .jno{font-size:10px;color:var(--sub);font-weight:700}
.jar .jq{display:grid;place-items:center;width:64%;aspect-ratio:1;border-radius:50%;background:#2a3b36;color:#7f958e;font-size:28px;font-weight:900;box-shadow:inset 0 0 0 4px #3c524b}
.jar .jimg{display:block;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 2px 6px #0002}
.jimg canvas,.ddimg canvas,.rimg canvas{display:block;width:100%;height:auto}
.jar .jname{font-size:12px;font-weight:900;line-height:1.25;text-align:center;min-height:2.5em;display:flex;align-items:center}
.jar.got{box-shadow:inset 0 0 0 2px #fff,inset 0 -8px 0 #d5efe6,0 0 0 3px var(--gold)}
.dtabs{display:flex;gap:8px;margin:6px 0 2px}
.dtab{flex:1;border:0;border-radius:14px;padding:10px 8px;font-weight:900;font-size:15px;background:#ffffffaa;color:var(--sub);box-shadow:0 3px 0 #b9dccc}
.dtab.on{background:#fff;color:inherit;box-shadow:0 3px 0 var(--moss);outline:2px solid var(--moss)}
.jar.foe .jimg{border-radius:14px}
.jar.foe:not(.got) .jname{color:#7f958e}
.jq.big{width:140px;font-size:56px;margin:auto}
.detail{margin-top:34px;background:#fff;border-radius:20px;padding:16px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:center;box-shadow:0 6px 18px #2674551a}
.detail[hidden]{display:none}
#dd-pic{width:100%;max-width:300px}
.ddimg{display:block;width:100%;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #0002}
#dd-name{margin:0;font-size:22px;font-weight:900}
#dd-desc{margin:6px 0;font-weight:700;line-height:1.6}
#dd-meta{margin:0;color:var(--sub);font-size:13px}

/* shop */
.bankbig{font-size:18px}
.equip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px;padding:8px 10px;background:#ffffffb0;border-radius:14px}
.eqlab{font-weight:900;font-size:13px;color:var(--moss-d)}.eqnone{font-size:13px;color:var(--sub)}
.eq{border:0;border-radius:12px;padding:6px 10px;background:#fff;box-shadow:0 3px 0 #b9dccc;display:flex;align-items:center;gap:4px;font-weight:900;font-size:14px}
.eq i{font-style:normal;font-size:20px}.eq.on{outline:3px solid var(--gold);background:#fff8dc}
.item.tool .itop{display:flex;gap:8px;align-items:center}.item.tool .iico{font-size:34px;line-height:1}.item.tool small{display:block;color:var(--sub);font-weight:700}.item.tool p{margin:0;font-size:13px}
.rpic{width:min(100%,260px);margin:0 auto 6px;border-radius:18px;overflow:hidden}.rpic canvas{display:block;width:100%;height:auto}
.shead{margin:20px 0 8px;font-size:18px;font-weight:900;color:var(--moss-d)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 #cde9de;min-width:0}
.item.on{outline:3px solid var(--moss)}
.item b{font-size:16px;font-weight:900}
.item p{margin:0;font-size:12.5px;color:var(--sub);flex:1}
.ipic{width:90px;margin:0 auto}
.buy{border:0;border-radius:12px;padding:8px;background:linear-gradient(135deg,var(--gold),var(--pink));color:var(--ink);font-weight:900;box-shadow:0 3px 0 #d9889f}
.buy:disabled{background:#e3ebe8;color:#7f958e;box-shadow:none;cursor:default}

@media (max-width:720px){
  #s-title .hero{grid-template-columns:minmax(0,1fr);text-align:center;padding-top:10px}
  #t-hero{max-width:220px;grid-row:1}
  .menu{grid-template-columns:minmax(0,1fr)}
  .stats{justify-content:center}
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shelf{grid-template-columns:repeat(3,minmax(0,1fr))}
  .detail{grid-template-columns:minmax(0,1fr);text-align:center}
  #dd-pic{margin:auto}
}
</style>
</head>
<body>

<div class="wrap">
  <section id="s-title">
    <div class="hero">
      <div>
        <p class="logo-sub">ちいさな湖の、おおきな冒険</p>
        <h1 class="logo"><span class="l1" data-t="まりもの">まりもの</span><span class="l2" data-t="大冒険">大冒険</span><i class="leaf a"></i><i class="leaf b"></i></h1>
        <span class="rank" id="t-title"></span>
        <div class="stats">
          <span class="chip">💧 しずく貯金 <b id="t-bank"></b></span>
          <span class="chip">★ <b id="t-stars"></b></span>
          <span class="chip">🌈 図鑑 <b id="t-dex"></b></span>
        </div>
      </div>
      <div id="t-hero"></div>
    </div>
    <div class="menu">
      <button type="button" class="go" id="b-play"><b>ぼうけんへ</b><span>草原・森・海・火山・未来の50コース</span></button>
      <button type="button" id="b-dex"><b>図鑑</b><span>虹まりもと敵キャラが棚に並ぶ</span></button>
      <button type="button" id="b-shop"><b>ごほうび屋</b><span>しずくで色や強化と交換</span></button>
    </div>
  </section>

  <section id="s-map" hidden>
    <div class="bar"><h2>コースをえらぶ</h2><button type="button" class="pbtn back">← タイトル</button></div>
    <div class="tabs" id="m-tabs" role="group" aria-label="ワールド"></div>
    <div class="equip" id="m-equip"></div>
    <h3 class="wtitle" id="m-wname"></h3>
    <p class="wnote" id="m-wnote"></p>
    <div class="cgrid" id="m-grid"></div>
  </section>

  <section id="s-play" hidden>
    <div class="bar"><h2 id="p-name"></h2><button type="button" class="pbtn" id="p-back">← コース一覧</button></div>
    <div id="stage"></div>
    <div class="result" id="result" hidden>
      <div class="rcard" role="dialog" aria-labelledby="r-title">
        <div class="rpic" id="r-pic"></div>
        <h3 id="r-title"></h3>
        <p class="rsub" id="r-sub"></p>
        <div class="rstars" id="r-stars"></div>
        <div class="rnums"><div><span>スコア</span><b id="r-score"></b></div><div><span>しずく</span><b id="r-drops"></b></div><div><span>ほしのかけら</span><b id="r-shard"></b></div><div><span>しずく貯金</span><b id="r-bank"></b></div></div>
        <div id="r-new"></div>
        <div class="rbtns"><button type="button" class="pbtn main" id="r-next">つぎのコースへ</button><button type="button" class="pbtn" id="r-again">もう一回</button><button type="button" class="pbtn" id="r-map">コース一覧</button></div>
      </div>
    </div>
  </section>

  <section id="s-dex" hidden>
    <div class="bar"><h2 id="d-h">虹まりも図鑑 <span class="chip"><b id="d-count"></b></span></h2><button type="button" class="pbtn back">← タイトル</button></div>
    <div class="dtabs"><button type="button" class="dtab on" id="dt-m">🌈 虹まりも</button><button type="button" class="dtab" id="dt-e">👾 敵キャラ</button></div>
    <p class="wnote" id="d-note">コースの虹色まりもを取ると、20種類のどれかに変身します。変身した虹まりもだけ、くわしく見られます。</p>
    <div id="d-shelf"></div>
    <div class="detail" id="d-detail" hidden>
      <div id="dd-pic"></div>
      <div><h3 id="dd-name"></h3><p id="dd-desc"></p><p id="dd-meta"></p><button type="button" class="pbtn" id="d-close">とじる</button></div>
    </div>
  </section>

  <section id="s-shop" hidden>
    <div class="bar"><h2>ごほうび屋</h2><span class="chip bankbig">💧 しずく貯金 <b id="s-bankv"></b></span><button type="button" class="pbtn back">← タイトル</button></div>
    <p class="wnote">コースで集めたしずくが貯金になります。クリアと星、ほしのかけら(1こ10)のボーナスもつきます。</p>
    <h3 class="shead">もちこみアイテム(1コースに1つ・使うとなくなる)</h3>
    <div class="sgrid" id="sh-items"></div>
    <h3 class="shead">まりもの色</h3>
    <div class="sgrid" id="sh-skins"></div>
    <h3 class="shead">ぼうけんの強化(ずっと効きます)</h3>
    <div class="sgrid" id="sh-ups"></div>
  </section>
</div>

<script>
var APP_CSS = `
.nc-app{--a:#2f8f4e;--on:#fff;--bg:#e4f6ee;--card:rgba(255,255,255,.82);--ink:#173a36;--sub:#5e8a7d;--line:#cfe8dd;--strong:#1b6349;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6;text-align:left}
.nc-app *{box-sizing:border-box}
.nc-title{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto;padding:16px 14px 4px;font-size:clamp(20px,4.4vw,28px);font-weight:800;line-height:1.15;color:var(--strong);letter-spacing:.03em}
.nc-title small{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:0;margin-top:4px}
.nc-mark{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#c6ff9b,#48a96d 62%,#236744);box-shadow:inset -5px -7px 0 #1e6543,0 5px 12px #27745133;position:relative}
.nc-mark:before,.nc-mark:after{content:"";position:absolute;background:#fff;border-radius:50%;width:8px;height:11px;top:15px;left:13px;box-shadow:13px 0 #fff}
.nc-mark:after{width:4px;height:6px;top:18px;left:15px;background:#173a36;box-shadow:13px 0 #173a36}
.nc-body{display:flex;flex-direction:column;gap:10px;padding:14px;max-width:900px;margin:0 auto}
.nc-hud{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.nc-pill{flex:1 1 84px;min-width:0;background:var(--card);border:1px solid #fff;border-radius:14px;padding:6px 12px;box-shadow:0 4px 14px #2674550c}
.nc-pill span{display:block;font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap}
.nc-pill strong{display:block;font-size:17px;color:var(--strong);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-pill.nc-wide{flex:2 1 150px}
.nc-pill[hidden]{display:none}
.nc-tools{display:flex;gap:6px;flex-wrap:wrap}
.nc-mini{font:inherit;font-weight:750;border:0;border-radius:13px;padding:8px 12px;background:#fff;color:#1b654b;box-shadow:0 3px 0 #b9dccc;cursor:pointer;touch-action:manipulation}
.nc-mini:active{transform:translateY(2px);box-shadow:0 1px 0 #b9dccc}
.nc-view{position:relative;border:4px solid #fff;border-radius:22px;overflow:hidden;box-shadow:0 12px 32px #246a4b26;background:#8bd8cf;touch-action:none;-webkit-user-select:none;user-select:none}
.nc-cv{display:block;width:100%;height:auto}
.nc-edit{overflow-x:auto;touch-action:pan-x pan-y;border-width:2px;border-radius:12px;box-shadow:none}
.nc-edit .nc-cv{max-width:none}
.nc-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;background:linear-gradient(180deg,#0c3b3b45,#092d345e);color:#fff}
.nc-ov[hidden]{display:none}
.nc-pz{position:absolute;top:10px;right:10px;z-index:3;width:44px;height:44px;border:2px solid #fff;border-radius:50%;background:linear-gradient(180deg,#7fc8ff,#2f86d6);color:#fff;font-weight:900;font-size:16px;box-shadow:0 3px 0 #0002;touch-action:none}
.nc-pzp{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(10,40,40,.55)}
.nc-pzp[hidden]{display:none}
.nc-pzin{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:20px;padding:18px 22px;min-width:220px;text-align:center;box-shadow:0 14px 30px #0004}
.nc-pzin b{font-size:20px;color:#1b6349}
.nc-ov h2{font-size:clamp(22px,5.5vw,40px);line-height:1.2;margin:0;text-shadow:0 3px 10px #073b35}
.nc-ov p{max-width:460px;margin:0 0 8px;font-weight:600;line-height:1.65;text-shadow:0 2px 5px #073b35}
.nc-btn{font:inherit;font-weight:750;font-size:18px;background:var(--a);color:var(--on);border:0;border-radius:13px;padding:12px 28px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.nc-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.nc-keys{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none;-webkit-user-select:none;user-select:none}
.nc-keys div{display:flex;gap:8px}
.nc-keys .nc-mini{min-width:60px;min-height:56px;font-size:22px;border:1px solid #fff;background:#ffffffd9;box-shadow:0 4px 0 #a9d5c2;touch-action:none}
.nc-keys .nc-jump{min-width:128px;font-size:16px;background:linear-gradient(135deg,#ffbd64,#ff8c62);color:#fff;box-shadow:0 4px 0 #d66b4d}
.nc-keys .nc-skill{min-width:96px;font-size:15px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);border:0}
.nc-keys .nc-skill[hidden]{display:none}
.nc-keys .nc-item{min-width:64px;font-size:28px;border:2px solid #fff;background:linear-gradient(180deg,#fff7d6,#ffd76a);box-shadow:0 4px 0 #d9a52a}
.nc-keys .nc-item[hidden]{display:none}
.nc-how{margin:0;font-size:12.5px;line-height:1.7;color:var(--sub)}
@media(min-width:700px){.nc-keys{max-width:650px;width:100%;margin:0 auto}.nc-how{text-align:center}}

  document.querySelectorAll('.back').forEach(function(b){b.onclick=function(){show('s-title');drawTitle()}});
  $('p-back').onclick=function(){show('s-map');drawMap()};
  $('d-close').onclick=function(){$('d-detail').hidden=true};
  drawTitle();
}
boot();

</script>
