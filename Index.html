<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>PDFまとめ編集</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PDF編集"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#4f5bd5">
<style>
:root{--bg:#f4f5f7;--fg:#14161a;--mut:#6b7280;--card:#fff;--bd:#e4e6eb;--ac:#4f5bd5;--ac2:#eceefc;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--fg:#f1f2f4;--mut:#9aa1ad;--card:#1a1d23;--bd:#2a2e36;--ac:#8791ff;--ac2:#232748;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f1115;--fg:#f1f2f4;--mut:#9aa1ad;--card:#1a1d23;--bd:#2a2e36;--ac:#8791ff;--ac2:#232748;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding:14px 14px 130px}
button{font:inherit;color:var(--fg);cursor:pointer}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.h1{font-size:22px;font-weight:700;letter-spacing:-.02em}.sub{font-size:12px;color:var(--mut);margin:2px 0 10px}
#msg{font-size:15px;font-weight:600;color:var(--ac);background:var(--ac2);border-radius:12px;padding:9px 12px;margin-bottom:8px;line-height:1.5}#msg:empty{display:none}#msg.err{color:#dc2626;background:rgba(220,38,38,.1)}
.p{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:7px 12px;font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.c{position:relative;background:var(--card);border-radius:16px;padding:8px;box-shadow:var(--sh);border:2px solid transparent;text-align:center}
.c.s{border-color:var(--ac)}.c.s::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;line-height:22px}
.c.f{animation:fl 1s}@keyframes fl{0%,60%{box-shadow:0 0 0 4px var(--ac)}100%{box-shadow:var(--sh)}}
.c canvas{max-width:100%;height:auto;background:#fff;display:block;margin:0 auto;border-radius:6px;border:1px solid var(--bd)}
.num{position:absolute;top:10px;left:10px;background:rgba(20,22,26,.8);color:#fff;border-radius:999px;min-width:24px;height:24px;padding:0 7px;font-size:12px;font-weight:700;line-height:24px;z-index:1}
.c .n{font-size:11px;color:var(--mut);margin:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c .b{display:flex;gap:6px;justify-content:center}
.ib{border:0;background:var(--ac2);color:var(--ac);width:40px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}.ib svg{width:18px;height:18px}
#empty{text-align:center;padding:70px 20px;color:var(--mut);font-size:14px;line-height:1.7}#empty svg{width:44px;height:44px;opacity:.5}
.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);display:flex;padding:6px;z-index:10;max-width:620px;margin:0 auto}
.d{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:10px;padding:8px 2px;border-radius:16px;color:var(--fg)}
.d.on{background:var(--ac2);color:var(--ac)}.d.pri{background:var(--ac);color:#fff}
#ed{position:fixed;inset:0;overflow:hidden;background:var(--bg);z-index:20;display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 10px 0}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0}#pgl{font-size:13px;color:var(--mut);font-weight:600}
.tb{border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-size:14px;display:flex;gap:4px;align-items:center;box-shadow:var(--sh)}.tb svg{width:18px;height:18px}.tb.pri{background:var(--ac);color:#fff}
#ed .w{position:relative;flex:1;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:var(--bd)}
#ec{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none;background:#fff;display:block;margin:0 auto}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 4px}
#rp{display:none;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ac2);border-radius:14px;padding:6px 10px;margin-top:6px;font-size:12px}#op{display:none;background:var(--ac2);border-radius:14px;padding:6px 10px;margin-top:6px}#op button,#rp button{border:0;background:var(--card);border-radius:9px;padding:6px 10px;font-size:13px}
#tin{display:none;position:absolute;z-index:3;white-space:pre;font-family:sans-serif;line-height:1.25;outline:2px dashed var(--ac);outline-offset:3px;min-width:1em;min-height:1.25em;-webkit-user-select:text;user-select:text;caret-color:var(--ac);background:rgba(255,255,255,.12)}
#sb{display:none;justify-content:center;gap:8px}#sb button{border:0;border-radius:10px;padding:8px 12px;font-size:13px;background:var(--card);box-shadow:var(--sh)}#sb button.p{background:var(--ac);color:#fff}
#tm,#fn,#bx,#pc,#tl,#tf,#ts{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:60}#tm .box,#fn .box,#bx .box,#pc .box,#tl .box,#tf .box,#ts .box{background:var(--card);width:100%;max-width:620px;margin:0 auto;border-radius:22px 22px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
#tmx{width:100%;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--bg);color:var(--fg);resize:vertical}#tm .row,#fn .row,#bx .row,#pc .row,#tl .row,#tf .row,#ts .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}#tm .row button:not(.p),#fn .row button:not(.p),#bx .row button:not(.p),#pc .row button:not(.p),#tl .row button:not(.p),#tf .row button:not(.p),#ts .row button:not(.p){border:1px solid var(--bd);background:none;border-radius:10px;padding:8px 12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:rgba(20,22,26,.9);color:#fff;padding:11px 16px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90%;text-align:center}
#op button.act{background:var(--ac);color:#fff}
#fnn,#tsn{width:100%;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--bg);color:var(--fg)}
.chips{display:flex;gap:8px;margin:12px 0 6px;flex-wrap:wrap}.chip{border:1px solid var(--bd);background:none;border-radius:999px;padding:8px 14px;font-size:14px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}#fnh{font-size:12px;color:var(--mut);line-height:1.5}
#bx .box{max-height:92%;overflow:auto}#bx .st{padding:8px 4px 2px}.cdot{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);padding:0}.cdot.on{outline:3px solid var(--ac);outline-offset:2px}
#pcv{display:block;margin:8px auto;touch-action:none;border-radius:10px;background:#222}
#shp .cdot{width:28px;height:28px}#shp .chip{padding:6px 10px;font-size:13px}
#pr,#op,#shp{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
#pr>*,#op>*,#shp>*,#op #opg>*{flex:none}
#ed.kb #op,#ed.kb #shp,#ed.kb #rp,#ed.kb #sb,#ed.kb .dock.ed{display:none!important}
#mhint{display:none;background:var(--ac);color:#fff;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;text-align:center;margin:0 0 6px;line-height:1.4}
.sbar{position:fixed;height:5px;border-radius:3px;background:rgba(0,0,0,.14);z-index:25;opacity:0;transition:opacity .3s;pointer-events:none}.sbar i{display:block;height:100%;background:var(--ac);border-radius:3px}
#tl .box,#tf .box{max-height:88%;overflow:auto}
.tr{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--bd)}.tr .tn{flex:1;font-weight:600}.tr small{display:block;font-weight:400;color:var(--mut);font-size:12px}.tr button{border:1px solid var(--bd);background:none;border-radius:10px;padding:8px 12px;font-size:13px}.tr button.p{background:var(--ac);color:#fff;border:0}
.tfr{display:block;margin:10px 0 4px}.tfr span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}.tfr input{width:100%;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--bg);color:var(--fg)}
input[type=range]{accent-color:var(--ac)}
.col{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);padding:0}.col.on{outline:2px solid var(--ac);outline-offset:2px}
.dock.ed{position:static;margin:4px auto calc(10px + env(safe-area-inset-bottom,0px));width:100%}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:70}
#sh{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
.st{font-size:13px;color:var(--mut);padding:6px 10px}.sr{display:block;width:100%;text-align:left;padding:15px 10px;border:0;border-bottom:1px solid var(--bd);background:none;font-size:16px}.sr:last-child{border:0;color:var(--mut)}
.tr canvas{width:56px;height:auto;flex:none;background:#fff;border:1px solid var(--bd);border-radius:6px}
#tpb{display:none;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:6px;background:var(--ac2);border-radius:14px;padding:6px 8px;margin:0 0 6px}
#tpb .r1{display:flex;align-items:center;gap:8px}#tpT{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--ac);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tpn{position:relative;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}#tpn .chip{flex:none;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 10px;font-size:13px;background:var(--card)}#tpn .chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head><body>
<svg style="display:none"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-all" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 12l3 3 5-6"/></symbol>

<symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></symbol>
<symbol id="i-line" viewBox="0 0 24 24"><path d="M3 15L15 3l6 6L9 21zM8 10l2 2M11 7l2 2M5 13l2 2"/></symbol>

<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>

<symbol id="i-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</defs></svg>
<div class="h1">PDFまとめ編集</div>
<div class="sub">結合・分割・回転・手書き・文字・画像。端末内だけで処理されます</div>
<div id="msg"></div>
<div id="grid"></div>
<div id="empty"><svg><use href="#i-img"/></svg><br>PDFや写真を追加して始めましょう<br>カードをタップで選択、◀▶で順番を入替、✎で編集</div>
<input id="fi" type="file" accept="application/pdf,.pdf,image/*,.tif,.tiff" multiple hidden>
<input id="phi" type="file" accept="image/*,.tif,.tiff" multiple hidden>
<div class="dock">
<button class="d pri" id="bAdd"><svg><use href="#i-plus"/></svg>追加</button>
<button class="d" id="bAll"><svg><use href="#i-all"/></svg>全選択</button>
<button class="d" id="bRot"><svg><use href="#i-rot"/></svg>回転</button>
<button class="d" id="bDel"><svg><use href="#i-del"/></svg>削除</button>
<button class="d" id="bUndo"><svg><use href="#i-undo"/></svg>戻る</button>
<button class="d" id="bShare"><svg><use href="#i-share"/></svg>共有</button>
</div>

<div id="ed">
<div class="top"><button class="tb" id="un"><svg><use href="#i-undo"/></svg>戻る</button><span id="pgl"></span><button class="tb pri" id="ok">完了</button></div>
<div id="mhint"></div>
<div class="ctx" id="tpb"><div class="r1"><button class="tb" id="tpP">‹ 前へ</button><span id="tpT"></span><button class="tb pri" id="tpN">次へ ›</button></div><div id="tpn"></div></div>
<div class="w" id="wrap"><canvas id="ec"></canvas></div>
<div class="ctx" id="pr">
<button class="col on" style="background:#111" data-c="#111111"></button><button class="col" style="background:#e11d48" data-c="#e11d48"></button><button class="col" style="background:#2563eb" data-c="#2563eb"></button><button class="col" style="background:#16a34a" data-c="#16a34a"></button><button class="col" style="background:#f59e0b" data-c="#f59e0b"></button><button class="col" style="background:#fff" data-c="#ffffff"></button>
<input type="color" id="cc" value="#111111" style="width:28px;height:28px;padding:0;border:0;background:none"><span style="font-size:12px;color:var(--mut)">太さ</span><input id="wd" type="range" min="1" max="14" value="3" style="width:90px">
</div>
<div class="ctx" id="op"><span id="opg" style="display:contents"><span style="font-size:12px">大きさ</span><input id="sz" type="range" min="1" max="100" value="20" style="width:80px">
<span style="font-size:12px">幅</span><input id="sx" type="range" min="20" max="300" value="100" style="width:80px">
<span style="font-size:12px">高さ</span><input id="sy" type="range" min="20" max="300" value="100" style="width:80px">
<button id="rl">↺</button><button id="rr">↻</button></span><button id="bsh">形変更</button><button id="bmv">移動</button><button id="bsz">枠サイズ</button><button id="bsc">全体拡大</button><button id="bfd">入力欄にする</button><button id="ex">入力</button><button id="dl">削除</button></div>
<div class="ctx" id="shp" style="display:none;background:var(--ac2);border-radius:14px;padding:6px 10px;margin-top:6px">
<button class="cdot" style="background:#e11d48" data-c="#e11d48"></button><button class="cdot" style="background:#111" data-c="#111111"></button><button class="cdot" style="background:#2563eb" data-c="#2563eb"></button><button class="cdot" style="background:#16a34a" data-c="#16a34a"></button><button class="cdot" style="background:#f59e0b" data-c="#f59e0b"></button><button class="cdot" style="background:#fff" data-c="#ffffff"></button>
<input id="shw" type="range" min="1" max="10" value="4" style="width:70px"><button class="chip" data-sd="0">実線</button><button class="chip" data-sd="1">点線</button>
<button class="chip" data-s="none">線のみ</button><button class="chip" data-s="hatch">斜線</button><button class="chip" data-s="grid">格子</button><button class="chip" data-s="mosaic">モザイク</button><button class="chip" data-s="fill">塗りつぶし</button></div>
<div class="ctx" id="sb"><button class="p" id="sT">文字をコピー</button><button class="p" id="sI">画像をコピー</button><button class="p" id="sO">線で囲う</button><button class="p" id="sC">トリミング</button><button id="sP">貼り付け</button><button id="sX">解除</button></div>
<div class="ctx" id="rp"><span>定規:本体ドラッグで移動・二本指で回転。縁のそばをなぞると縁に沿って線が引けます</span><button id="r0">水平</button><button id="r9">垂直</button><button id="rl2">↺</button><button id="rr2">↻</button><button id="rx">閉じる</button></div>
<div class="dock ed">
<button class="d on" data-m="pen"><svg><use href="#i-pen"/></svg>ペン</button>
<button class="d" id="eRul"><svg><use href="#i-line"/></svg>定規</button>
<button class="d" data-m="text"><svg><use href="#i-text"/></svg>文字</button>
<button class="d" data-m="move"><svg><use href="#i-cur"/></svg>範囲選択</button>
<button class="d" id="eAdd"><svg><use href="#i-img"/></svg>追加</button>
<button class="d" id="eMore"><svg><use href="#i-more"/></svg>その他</button>
</div>
<div hidden><button id="cl"></button><button id="zi"></button><button id="zo"></button><button id="rt"></button></div>
<input id="pi" type="file" accept="image/*,.tif,.tiff" hidden><input id="pf" type="file" accept="application/pdf,.pdf,image/*,.tif,.tiff" hidden>
</div>
<div id="tm"><div class="box"><div class="st" id="tmt"></div><textarea id="tmx" rows="7"></textarea><img id="tmim" alt="" style="display:none;max-width:100%;border-radius:10px;margin-top:8px"><div class="row"><button class="p" id="tmc">コピー</button><button id="tmi">画像で表示</button><button id="tma">画像から認識し直す</button><button id="tmz">閉じる</button></div></div></div>
<div id="fn"><div class="box"><div class="st">ファイル名(タップして変更できます)</div><input id="fnn" type="text" placeholder="ファイル名"><div class="chips"><button class="chip on" data-f="pdf">PDF</button><button class="chip" data-f="jpg">JPEG画像</button><button class="chip" data-f="png">PNG画像</button></div><div id="fnh"></div><div class="row"><button class="p" id="fnok">書き出して共有</button><button id="fnx">キャンセル</button></div></div></div>
<div id="bx"><div class="box"><div class="st">線で囲う</div>
<div class="st">線の色</div><div class="chips"><button class="cdot on" style="background:#e11d48" data-c="#e11d48"></button><button class="cdot" style="background:#111" data-c="#111111"></button><button class="cdot" style="background:#2563eb" data-c="#2563eb"></button><button class="cdot" style="background:#16a34a" data-c="#16a34a"></button><button class="cdot" style="background:#f59e0b" data-c="#f59e0b"></button><button class="cdot" style="background:#fff" data-c="#ffffff"></button></div>
<div class="st">太さ・線の種類</div><div class="chips"><input id="bxw" type="range" min="1" max="10" value="4" style="width:120px"><button class="chip on" data-d="0">実線</button><button class="chip" data-d="1">点線</button></div>
<div class="st">内側の加工</div><div class="chips"><button class="chip on" data-x="none">線のみ</button><button class="chip" data-x="hatch">斜線</button><button class="chip" data-x="grid">格子</button><button class="chip" data-x="mosaic">モザイク</button><button class="chip" data-x="fill">塗りつぶし</button></div>
<div class="row"><button class="p" id="bxok">囲う</button><button class="p" id="bxok2">形変更</button><button id="bxx">キャンセル</button></div></div></div>
<div id="pc"><div class="box"><div class="st">写真をトリミング(四隅をドラッグ)</div><canvas id="pcv"></canvas><div class="chips"><button class="chip on" data-r="0">自由</button><button class="chip" data-r="1">1:1</button><button class="chip" data-r="1.3333">4:3</button><button class="chip" data-r="0.75">3:4</button><button class="chip" data-r="1.7778">16:9</button></div><div class="row"><button class="p" id="pcok">トリミングして使う</button><button id="pcn">そのまま使う</button><button id="pcx">キャンセル</button></div></div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id),PI=Math.PI,ec=$("ec"),wrap=$("wrap");
const files=[];let pages=[],cur=null,sel=null,mode="pen",col="#111111",st=null,drag=null,baseW=360,g=null;
const say=t=>{const e=$("msg");e.textContent=t||"";e.className=/失敗|できません|読み込め/.test(t||"")?"err":""},clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function toUnrot(u,v,A){return A==90?[v,1-u]:A==180?[1-u,1-v]:A==270?[1-v,u]:[u,v]}
function toDisp(a,b,A){return A==90?[1-b,a]:A==180?[1-a,1-b]:A==270?[b,1-a]:[a,b]}
const ang=pg=>(pg.base+pg.r)%360;
const bytesOf=(c,t="image/jpeg")=>new Promise(r=>c.toBlob(async b=>r(new Uint8Array(await b.arrayBuffer())),t,.9));

function bmOf(it){
  if(it.k=="i")return it.bm;
  const key=it.str+"|"+it.c;
  if(it.key!==key){
    const L=it.str.split("\n"),f=60,c=document.createElement("canvas"),x=c.getContext("2d");
    x.font=f+"px sans-serif";
    c.width=Math.ceil(Math.max(...L.map(l=>x.measureText(l).width)))+16;c.height=Math.ceil(L.length*f*1.25)+12;
    x.font=f+"px sans-serif";x.fillStyle=it.c;x.textBaseline="middle";
    L.forEach((l,k)=>x.fillText(l,8,6+(k+.5)*f*1.25));
    it.bmc=c;it.key=key;
  }
  return it.bmc;
}
const sc=(it,pg)=>it.k=="i"?it.w*pg.W/it.bm.width:it.s*pg.W/60;

async function renderPage(pg,cv,w,withMarks=true){
  const page=await files[pg.f].doc.getPage(pg.i+1),A=ang(pg);
  const s=w/page.getViewport({scale:1,rotation:A}).width,vp=page.getViewport({scale:s,rotation:A});
  cv.width=vp.width;cv.height=vp.height;
  const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:x,viewport:vp}).promise;
  if(withMarks)drawMarks(x,pg,cv.width,cv.height);
}
function drawMarks(x,pg,cw,ch,extra){
  const A=ang(pg);x.lineCap=x.lineJoin="round";
  for(const s of pg.strokes.concat(extra?[extra]:[])){
    x.strokeStyle=s.c;x.lineWidth=s.w*(A%180==0?cw:ch);x.beginPath();
    s.p.forEach(([a,b],k)=>{const [u,v]=toDisp(a,b,A);k?x.lineTo(u*cw,v*ch):x.moveTo(u*cw,v*ch)});
    if(s.p.length==1){const [u,v]=toDisp(...s.p[0],A);x.lineTo(u*cw+.1,v*ch)}
    x.stroke();
  }
  const ppp=(A%180==0?cw:ch)/pg.W;
  for(const it of pg.items){if(it===editing)continue;
    const bm=bmOf(it),s=sc(it,pg)*ppp,[u,v]=toDisp(it.a,it.b,A),w=bm.width*s*(it.sx||1),h=bm.height*s*(it.sy||1);
    x.save();x.translate(u*cw,v*ch);x.rotate((it.rot+A)*PI/180);x.drawImage(bm,-w/2,-h/2,w,h);if(it.field=="input"&&x.canvas.id=="ec"){x.strokeStyle="#f59e0b";x.lineWidth=Math.max(1.5,cw/400);x.setLineDash([8,6]);x.strokeRect(-w/2,-h/2,w,h);x.setLineDash([]);x.lineWidth=Math.max(4,cw/140);x.beginPath();x.moveTo(-w/2,-h/2);x.lineTo(-w/2,h/2);x.stroke()}
    if(it===sel&&x.canvas.id=="ec"){x.lineWidth=Math.max(2,cw/250);x.strokeStyle=emode=="size"?"#16a34a":emode=="scale"?"#f59e0b":emode=="move"?"#e11d48":"#2563eb";x.setLineDash(emode?[]:[6,4]);x.strokeRect(-w/2,-h/2,w,h);if(emode=="size"||emode=="scale"){x.fillStyle=emode=="size"?"#16a34a":"#f59e0b";x.beginPath();x.arc(w/2,h/2,Math.max(10,cw/30),0,7);x.fill()}}
    x.restore();
  }
}

function draw(flash){
  const gr=$("grid");gr.innerHTML="";$("empty").style.display=pages.length?"none":"block";
  pages.forEach((pg,k)=>{
    const d=document.createElement("div");d.className="c"+(pg.sel?" s":"")+(flash===k?" f":"");
    const cv=document.createElement("canvas"),nm=document.createElement("div"),n=document.createElement("div"),b=document.createElement("div");
    nm.className="num";nm.textContent=k+1;n.className="n";n.textContent=`${files[pg.f].name} p${pg.i+1}`;b.className="b";
    const mk=(t,fn)=>{const e=document.createElement("button");e.className="ib";e.innerHTML='<svg><use href="#i-'+t+'"/></svg>';e.onclick=ev=>{ev.stopPropagation();fn()};b.appendChild(e)};
    mk("l",()=>mv(k,-1));mk("pen",()=>openEd(pg));mk("r",()=>mv(k,1));
    d.append(nm,cv,n,b);d.onclick=()=>{pg.sel=!pg.sel;d.classList.toggle("s",pg.sel)};
    gr.appendChild(d);renderPage(pg,cv,260);
    if(flash===k)setTimeout(()=>d.scrollIntoView({block:"nearest"}),50);
  });
}
function mv(k,d){const j=k+d;if(j<0||j>=pages.length)return;snap();[pages[k],pages[j]]=[pages[j],pages[k]];say(`${k+1}枚目を${j+1}枚目に移動しました`);draw(j)}

function loadImg(f){return new Promise((ok,ng)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=ng;im.src=u})}
async function imgCanvas(f,max){const im=await loadImg(f),r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c}
async function imgToPdf(f){
  let c=await imgCanvas(f,2000);c=await cropPhoto(c);if(!c)return null;const d=await PDFLib.PDFDocument.create(),im=await d.embedJpg(await bytesOf(c));
  const p=d.addPage([595,595*c.height/c.width]);p.drawImage(im,{x:0,y:0,width:p.getWidth(),height:p.getHeight()});return d.save();
}
$("fi").onchange=$("phi").onchange=async e=>{if(e.target.files.length)snap();
  for(const f of e.target.files){
    try{
      say("読み込み中: "+f.name);
      const bytes=(f.type.startsWith("image/")||/\.tiff?$/i.test(f.name))?await imgToPdf(f):new Uint8Array(await f.arrayBuffer());
      if(!bytes){say("");continue}
      const doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
      const fi=files.push({name:f.name.replace(/\.[^.]+$/,""),bytes,doc})-1;
      for(let i=0;i<doc.numPages;i++){
        const p=await doc.getPage(i+1),v=p.view;
        pages.push({f:fi,i,r:0,base:p.rotate%360,W:v[2]-v[0],H:v[3]-v[1],sel:false,strokes:[],items:[]});
      }
    }catch(err){say("読み込めませんでした: "+f.name)}
  }
  e.target.value="";say("");draw();
};
$("bAll").onclick=()=>{const on=!pages.every(p=>p.sel);pages.forEach(p=>p.sel=on);draw()};
$("bRot").onclick=()=>{const s=pages.filter(p=>p.sel);if(!s.length)return say("回転するページを選択してください");snap();s.forEach(p=>p.r=(p.r+90)%360);say("");draw()};
$("bDel").onclick=()=>{const s=pages.filter(p=>p.sel);if(!s.length)return say("削除するページを選択してください");sheet(s.length+"ページを削除しますか?",[["削除する",()=>{snap();pages=pages.filter(p=>!p.sel);say(s.length+"ページを削除しました。下の「戻る」で元に戻せます");draw()}]])};


async function build(list){
  const {PDFDocument,rgb,degrees,LineCapStyle}=PDFLib,out=await PDFDocument.create(),cache={};
  for(const pg of list){
    if(!(pg.f in cache)){try{cache[pg.f]=await PDFDocument.load(files[pg.f].bytes,{ignoreEncryption:true})}catch(_){cache[pg.f]=null}}
    const {W,H}=pg;let cp,added=false;
    try{if(!cache[pg.f])throw 0;[cp]=await out.copyPages(cache[pg.f],[pg.i])}catch(_){
      const c=document.createElement("canvas");
      await renderPage({...pg,base:0,r:0,strokes:[],items:[]},c,Math.min(W*2,1600),false);
      const im=await out.embedJpg(await bytesOf(c));cp=out.addPage([W,H]);added=true;cp.drawImage(im,{x:0,y:0,width:W,height:H});
    }
    for(const s of pg.strokes){
      const h=s.c.slice(1),cl=rgb(parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255);
      const P=s.p.map(([a,b])=>({x:a*W,y:H*(1-b)}));if(P.length==1)P.push({x:P[0].x+.1,y:P[0].y});
      for(let k=1;k<P.length;k++)cp.drawLine({start:P[k-1],end:P[k],thickness:s.w*W,color:cl,lineCap:LineCapStyle.Round});
    }
    for(const it of pg.items){
      const bm=bmOf(it),s=sc(it,pg),w=bm.width*s*(it.sx||1),h=bm.height*s*(it.sy||1),th=-it.rot*PI/180,cx=it.a*W,cy=H*(1-it.b);
      const im=it.k=="i"?(it.png?await out.embedPng(it.shape?await bytesOf(it.bm,"image/png"):it.jpg):await out.embedJpg(it.jpg)):await out.embedPng(await bytesOf(bm,"image/png"));
      cp.drawImage(im,{x:cx-(w/2*Math.cos(th)-h/2*Math.sin(th)),y:cy-(w/2*Math.sin(th)+h/2*Math.cos(th)),width:w,height:h,rotate:degrees(th*180/PI)});
    }
    cp.setRotation(degrees(ang(pg)));if(!added)out.addPage(cp);
  }
  return out.save();
}
function exp(selOnly){
  const list=pages.filter(p=>!selOnly||p.sel);
  if(!list.length)return say(selOnly?"取り出すページを選択してください":"ページがありません");
  pend=list;const one=new Set(list.map(p=>p.f));
  $("fnn").value=one.size==1?files[list[0].f].name:"結合PDF";setFmt("pdf");$("fn").style.display="flex"}
async function saveFile(bytes,name){
  const u=URL.createObjectURL(new Blob([bytes])),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
  say("保存しました。「ファイル」アプリのダウンロードに入ります")}
async function saveFiles(fs,base){
  if(fs.length==1)return saveFile(new Uint8Array(await fs[0].arrayBuffer()),fs[0].name);
  if(typeof JSZip=="undefined")return say("複数ファイルの保存に対応していません");
  const z=new JSZip();fs.forEach(f=>z.file(f.name,f));
  await saveFile(await z.generateAsync({type:"uint8array"}),base+".zip")}
async function deliverFiles(fs,base){
  if(navigator.canShare&&navigator.canShare({files:fs})){
    try{await navigator.share({files:fs,title:base});return say("共有しました")}
    catch(e){
      if(e.name=="AbortError")return say("共有をキャンセルしました");
      if(e.name=="NotAllowedError"){
        const m=$("msg");m.className="";m.textContent="準備できました ";
        const b=document.createElement("button");b.textContent="共有シートを開く";b.className="p";
        b.onclick=async()=>{try{await navigator.share({files:fs,title:base});say("共有しました")}catch(_){await saveFiles(fs,base)}};
        m.appendChild(b);return}}}
  await saveFiles(fs,base)}
async function runExport(list,name,fmt){
  try{
    say("作成中…");
    if(fmt=="pdf"){const b=await build(list);return deliverFiles([new File([b],name+".pdf",{type:"application/pdf"})],name)}
    const ext=fmt=="png"?".png":".jpg",type=fmt=="png"?"image/png":"image/jpeg",fs=[];
    for(let i=0;i<list.length;i++){
      say(`画像を作成中… ${i+1}/${list.length}`);
      const c=document.createElement("canvas");await renderPage(list[i],c,1800,true);
      const b=await new Promise(r=>c.toBlob(r,type,.92));
      fs.push(new File([b],list.length==1?name+ext:`${name}_${String(i+1).padStart(2,"0")}${ext}`,{type}))}
    await deliverFiles(fs,name)
  }catch(err){say("作成に失敗しました。暗号化PDFは非対応です")}}
// ---- エディタ ----
function setMode(m){sbAll();mode=m;emode=null;selR=null;sdrag=null;document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m==m));if(m=="pen"||m=="line"){sel=null;syncPanel()}paint()}
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{setMode(b.dataset.m);if(b.dataset.m=="move")toast("画面をなぞって範囲を選びます");if(b.dataset.m=="text"){if(sel&&sel.k=="t")startEdit(sel);else newText(toUnrot(.5,.35,ang(cur)))}});
function syncPanel(){sbAll();
  $("op").style.display=sel?"flex":"none";$("pr").style.display=sel&&sel.shape?"none":"";$("shp").style.display=sel&&sel.shape?"flex":"none";if(!sel)return;
  const t=sel.k=="t";$("ex").style.display=$("bmv").style.display=$("bsz").style.display=$("bsc").style.display=$("bfd").style.display=t?"":"none";$("bfd").textContent=sel.field=="input"?"固定に戻す":"入力欄にする";$("bfd").classList.toggle("act",sel.field=="input");$("bsc").classList.toggle("act",emode=="scale");$("bsh").style.display=sel.shape?"":"none";$("bsh").classList.toggle("act",emode=="shape");$("opg").style.display=sel.shape?"none":"contents";if(sel.shape)shpUI();$("bmv").classList.toggle("act",emode=="move");$("bsz").classList.toggle("act",emode=="size");
  $("sz").value=sel.k=="i"?sel.w*100:sel.s*700-4;$("sx").value=(sel.sx||1)*100;$("sy").value=(sel.sy||1)*100;
}
async function openEd(pg){sbAll();cur=pg;emode=null;ruler={on:false,a:.5,b:.4,deg:0};rotInfo=null;rulerUI();$("pgl").textContent=(pages.indexOf(pg)+1)+" / "+pages.length;sel=null;$("ed").style.display="flex";setMode(pg.tf&&pg.tf.length?"text":"pen");tplBar();await redrawBase()}
const baseCv=document.createElement("canvas");
async function redrawBase(){selR=null;if(!cur._base)cur._base=snapOf(cur);
  {const A0=ang(cur),pw=A0%180==0?cur.W:cur.H,ph=A0%180==0?cur.H:cur.W;baseW=Math.max(120,Math.min(wrap.clientWidth-4,(wrap.clientHeight-4)*pw/ph,900))}
  await renderPage(cur,baseCv,Math.min(baseW*2.5,2400),false);
  ec.width=baseCv.width;ec.height=baseCv.height;ec.style.width=baseW+"px";paint();
}
function paint(){if(!cur)return;const x=ec.getContext("2d");x.drawImage(baseCv,0,0);drawMarks(x,cur,ec.width,ec.height,st);drawTpl(x);tplBar();if(ruler.on)drawRuler(x);drawRot(x);drawHandles(x);if(selR&&mode=="move")drawSel(x);$("sb").style.display=(selR&&mode=="move")?"flex":"none";if(editing)placeEdit();if(!P.size&&!editing){clearTimeout(cT);cT=setTimeout(commit,450)}}
function pt(e){const r=ec.getBoundingClientRect();return toUnrot((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,ang(cur))}
function hit(e){
  const r=ec.getBoundingClientRect(),A=ang(cur),px=e.clientX-r.left,py=e.clientY-r.top,ppp=(A%180==0?r.width:r.height)/cur.W;
  for(let k=cur.items.length-1;k>=0;k--){
    const it=cur.items[k],bm=bmOf(it),s=sc(it,cur)*ppp,[u,v]=toDisp(it.a,it.b,A),dx=px-u*r.width,dy=py-v*r.height,f=(it.rot+A)*PI/180;
    const lx=dx*Math.cos(f)+dy*Math.sin(f),ly=-dx*Math.sin(f)+dy*Math.cos(f);
    if(Math.abs(lx)<=bm.width*s*(it.sx||1)/2+10&&Math.abs(ly)<=bm.height*s*(it.sy||1)/2+10)return it;
  }
  return null;
}
function snap(q0,q1){
  const A=ang(cur),[u0,v0]=toDisp(...q0,A);let [u1,v1]=toDisp(...q1,A);
  const dx=(u1-u0)*ec.width,dy=(v1-v0)*ec.height;
  if(Math.abs(dy)<Math.abs(dx)*.06)v1=v0;else if(Math.abs(dx)<Math.abs(dy)*.06)u1=u0;
  return toUnrot(u1,v1,A);
}
const P=new Map();
function G(){const [a,b]=[...P.values()];return{d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,an:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2}}
ec.onpointerdown=e=>{
  if(P.size)tplTapF=null;commit();ec.setPointerCapture(e.pointerId);P.set(e.pointerId,e);
  if(P.size==2){pendDesel=false;sdrag=null;clearTimeout(lpT);lpT=null;rz=null;createTap=null;st=null;drag=null;let onItem=false;if(!(ruler.on&&mode=="pen")){const h=hit(e)||hit([...P.values()][0]);if(h){if(h!==sel){sel=h;emode=null;setHint();syncPanel()}onItem=true}}const n=G(),r0=ec.getBoundingClientRect();g={fx:(n.mx-r0.left)/r0.width,fy:(n.my-r0.top)/r0.height,d0:n.d,a0:n.an,pm:n,zw:ec.getBoundingClientRect().width,sz:sel?(sel.k=="i"?sel.w:sel.s):0,rot:sel?sel.rot:0};g.item=onItem;if(ruler.on&&mode=="pen"&&(rdrag||isBody(e))){const m=pt({clientX:n.mx,clientY:n.my});g.ruler=true;g.deg0=ruler.deg;g.off=[ruler.a-m[0],ruler.b-m[1]];rdrag=null}paint();return}
  if(P.size>2)return;
  const q=pt(e);tplTapF=(mode=="text"&&!hit(e))?tplHit(e):null;
  if(mode=="pen"){
    const A=ang(cur),dw=(A%180==0?baseW:baseW*ec.height/ec.width),z=ruler.on?rulerHit(e):null;
    if(z&&z.zone=="body"){rdrag=[q[0]-ruler.a,q[1]-ruler.b];paint();return}
    st={c:col,w:(+$("wd").value)/dw,p:[q]};
    if(z&&z.edge){st.edge=z.edge;st.tmin=st.tmax=edgeT(e);st.p=[edgeAt(z.edge,st.tmin),edgeAt(z.edge,st.tmax)]}
  }else{
    const h=hit(e),was=sel;
    moved=false;tapEdit=false;createTap=null;dp={x:e.clientX,y:e.clientY};
    if(emode=="shape"&&sel&&sel.shape&&(shI=shapeHit(e))>=0){shOff=[q[0]-(sel.a+sel.shape.rel[shI][0]),q[1]-(sel.b+sel.shape.rel[shI][1])]}
    else if((emode=="size"||emode=="scale")&&sel&&sel.k=="t"&&hitHandle(e,sel)){rz=sel;if(emode=="scale"){const L=loc(e,sel);rz0={s:sel.s,d:Math.max(1,Math.hypot(L.lx,L.ly))}}}
    else if(emode=="move"&&sel&&sel.k=="t"&&(!h||h===sel)){drag=[q[0]-sel.a,q[1]-sel.b];tapEdit=(h===sel)}
    else if(h){
      if(h!==sel){sel=h;emode=null;setHint()}
      if(h.k=="t"){
        tapEdit=(h===was);lpPt=dp;clearTimeout(lpT);
        lpT=setTimeout(()=>{lpT=null;tapEdit=false;itemMenu(h)},400);
        if(emode=="move")drag=[q[0]-h.a,q[1]-h.b];
      }else drag=[q[0]-h.a,q[1]-h.b];
    }else if(mode=="move"){if(sel)pendDesel=true;selStart(e)}
    else if(sel)pendDesel=true;
    else if(mode=="text")createTap=q;
    syncPanel();
  }
  paint();
};
ec.onpointermove=e=>{
  if(!P.has(e.pointerId))return;P.set(e.pointerId,e);
  if(P.size==2&&g){
    const n=G();
    if(g.ruler){const m=pt({clientX:n.mx,clientY:n.my});ruler.deg=snapRot(g.deg0+(n.an-g.a0)*180/PI);ruler.a=m[0]+g.off[0];ruler.b=m[1]+g.off[1];rotShow(ruler.a,ruler.b,ruler.deg);paint();return}
    if(g.item&&sel&&!sel.shape){
      const r=n.d/g.d0;
      if(sel.k=="i")sel.w=clamp(g.sz*r,.03,1.5);else sel.s=clamp(g.sz*r,.007,.15);
      sel.rot=snapRot(g.rot+(n.an-g.a0)*180/PI);rotShow(sel.a,sel.b,sel.rot);syncPanel();paint();
    }else{zoomAt(g.zw*n.d/g.d0,g.fx,g.fy,n.mx,n.my)}
    return;

  if(sigOf(cur)!==cur._base.sig){(cur._hist=cur._hist||[]).push(cur._base);if(cur._hist.length>80)cur._hist.shift();cur._base=snapOf(cur)}}
function undoLast(){
  endEdit();clearTimeout(cT);commit();
  const h=cur._hist||[];if(!h.length)return toast("戻せる操作がありません");
  const sn=h.pop();sel=null;emode=null;
  cur.strokes=sn.strokes.slice();
  cur.items=sn.items.map(x=>{const p={...x.p};if(!p.shape)delete p.shape;Object.assign(x.it,p);x.it.field=p.field;return x.it});
  cur._base=snapOf(cur);setHint();syncPanel();paint();toast("1つ前に戻しました",1200)}
// ---- スクロールバー表示(数秒)
const SB={};
function sbShow(el,ms=3000){
  if(!el||el.offsetParent===null&&getComputedStyle(el).position!=="fixed")return;
  let b=SB[el.id];if(!b){b=SB[el.id]=document.createElement("div");b.className="sbar";b.innerHTML="<i></i>";document.body.appendChild(b)}
  if(el.scrollWidth<=el.clientWidth+2){b.style.opacity=0;return}
  const r=el.getBoundingClientRect(),w=r.width-16,th=Math.max(28,w*el.clientWidth/el.scrollWidth),x=(w-th)*(el.scrollLeft/(el.scrollWidth-el.clientWidth));
  Object.assign(b.style,{left:r.left+8+"px",top:r.bottom-7+"px",width:w+"px",opacity:1});
  b.firstChild.style.cssText="width:"+th+"px;transform:translateX("+x+"px)";
  clearTimeout(b._t);b._t=setTimeout(()=>{b.style.opacity=0},ms)}
function sbAll(){["pr","op","shp"].forEach(id=>setTimeout(()=>sbShow($(id)),220))}
["pr","op","shp"].forEach(id=>$(id).addEventListener("scroll",()=>sbShow($(id),1800),{passive:true}));

// ---- テンプレート(入力欄つきの再利用ファイル)
function tdb(op,arg){return new Promise((res,rej)=>{
  const q=indexedDB.open("pdfapp",1);q.onupgradeneeded=()=>q.result.createObjectStore("tpl",{keyPath:"id"});q.onerror=()=>rej(q.error);
  q.onsuccess=()=>{const db=q.result,tx=db.transaction("tpl",op=="all"?"readonly":"readwrite"),st=tx.objectStore("tpl");let r;
    if(op=="put")r=st.put(arg);else if(op=="del")r=st.delete(arg);else r=st.getAll();
    tx.oncomplete=()=>{db.close();res(r&&r.result)};tx.onerror=()=>rej(tx.error)}})}
$("bfd").onclick=()=>{if(sel&&sel.k=="t"){sel.field=sel.field=="input"?undefined:"input";syncPanel();paint();toast(sel.field=="input"?"入力欄にしました。文字は入力欄のタイトルにしてください(例:お客様名、スタッフ名)。入力欄の左端が位置の基準です":"固定テキストに戻しました",7000)}};
let tsList=null;
function tplSave(selOnly){
  const list=pages.filter(p=>!selOnly||p.sel);
  if(!list.length)return say(selOnly?"保存するページを選択してください":"ページがありません");
  tsList=list;let ni=0,nf=0;list.forEach(p=>p.items.forEach(it=>{if(it.k=="t"){it.field=="input"?ni++:nf++}}));
  $("tsh").textContent="入力欄 "+ni+"個・固定の文字 "+nf+"個。ペンや画像は、元のPDFに焼き込んで保存します。入力欄の左端が文字の開始位置になり、文字が増えると右へ伸びます。";
  $("tsn").value=files[list[0].f].name+"のテンプレート";$("ts").style.display="flex"}
$("tsx").onclick=()=>{$("ts").style.display="none"};
$("tsok").onclick=async()=>{
  const name=$("tsn").value.trim()||"テンプレート",list=tsList;$("ts").style.display="none";
  try{
    say("テンプレートを作成中…");
    const bytes=await build(list.map(p=>({...p,items:p.items.filter(i=>i.k!="t")}))),fields=[];
    list.forEach((p,pi)=>p.items.forEach(it=>{if(it.k=="t")fields.push({page:pi,a:it.a,b:it.b,s:it.s,c:it.c,sx:it.sx||1,sy:it.sy||1,rot:it.rot||0,type:it.field=="input"?"input":"fixed",str:it.str})}));
    await tdb("put",{id:String(Date.now()),name,created:Date.now(),pdf:bytes,fields,pages:list.length});
    say("テンプレート「"+name+"」を保存しました。「追加」→「テンプレートから」で使えます")
  }catch(e){say("テンプレートを保存できませんでした")}};
async function tplList(){
  let L=[];try{L=await tdb("all")}catch(e){return toast("この環境ではテンプレートを保存できません")}
  L.sort((a,b)=>b.created-a.created);const c=$("tlc");c.innerHTML="";
  if(!L.length){const d=document.createElement("div");d.style.cssText="padding:12px;color:var(--mut);font-size:14px;line-height:1.7";d.textContent="まだテンプレートがありません。編集画面で文字を置き、入力したい所を「入力欄にする」にしてから、共有 →「テンプレートに保存」を選んでください。";c.appendChild(d)}
  L.forEach(r=>{
    const row=document.createElement("div"),tn=document.createElement("div"),sm=document.createElement("small"),b1=document.createElement("button"),b2=document.createElement("button");
    row.className="tr";tn.className="tn";tn.textContent=r.name;sm.textContent="入力欄 "+r.fields.filter(f=>f.type=="input").length+"・固定 "+r.fields.filter(f=>f.type!="input").length+"・"+(r.pages||1)+"ページ";tn.appendChild(sm);
    b1.className="p";b1.textContent="使う";b1.onclick=()=>tplOpen(r);b2.textContent="削除";
    b2.onclick=()=>sheet("「"+r.name+"」を削除しますか?",[["削除する",async()=>{await tdb("del",r.id);tplList()}]]);
    const th=document.createElement("canvas");row.append(th,tn,b1,b2);c.appendChild(row);tplThumb(r,th)});
  $("tl").style.display="flex"}
$("tlx").onclick=()=>{$("tl").style.display="none"};
function tplForm(r){
  $("tl").style.display="none";const c=$("tfc");c.innerHTML="";$("tft").textContent=r.name;const ins=[];
  r.fields.forEach((f,k)=>{if(f.type!="input")return;const w=document.createElement("label"),sp=document.createElement("span"),i=document.createElement("input");
    w.className="tfr";sp.textContent=f.str;i.type="text";i.placeholder=f.str+"を入力";w.append(sp,i);c.appendChild(w);ins.push([k,i])});
  if(!ins.length){const d=document.createElement("div");d.style.cssText="padding:10px 4px;color:var(--mut);font-size:14px";d.textContent="入力欄はありません。固定の文字だけが入ります。";c.appendChild(d)}
  $("tfok").onclick=async()=>{const vals={};ins.forEach(([k,i])=>vals[k]=i.value);$("tf").style.display="none";try{await tplMake(r,vals)}catch(e){say("テンプレートを開けませんでした")}};
  $("tf").style.display="flex"}
$("tfx").onclick=()=>{$("tf").style.display="none"};
async function tplMake(r,vals){
  snap();say("作成中…");
  const bytes=new Uint8Array(r.pdf),doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise,fi=files.push({name:r.name,bytes,doc})-1,pgs=[];
  for(let i=0;i<doc.numPages;i++){const p=await doc.getPage(i+1),v=p.view;pgs.push({f:fi,i,r:0,base:p.rotate%360,W:v[2]-v[0],H:v[3]-v[1],sel:false,strokes:[],items:[]})}
  r.fields.forEach((f,k)=>{
    const str=f.type=="input"?(vals[k]||""):f.str;if(!str||!str.trim()||!pgs[f.page])return;
    pgs[f.page].items.push({k:"t",a:f.a,b:f.b,str,s:f.s,c:f.c,rot:f.rot,sx:f.sx,sy:f.sy})});
  pages.push(...pgs);draw();say("「"+r.name+"」を追加しました。文字は編集画面で直せます")}

// ---- テンプレ入力モード(テンプレPDFを開いて ①②③ と入力)
let tplTapF=null,tcur=null,tplSig="";
const tplFs=()=>cur&&cur.tf||[],tplAll=()=>cur&&cur.tfAll||[];
const circ=n=>n<=20?String.fromCharCode(0x245f+n):"("+n+")";
const tplHas=f=>!!(f.it&&f.pg.items.includes(f.it)),tplDone=f=>tplHas(f)&&!!f.it.str.trim();
function tplHit(e){
  const r=ec.getBoundingClientRect(),A=ang(cur),px=e.clientX-r.left,py=e.clientY-r.top,ppp=(A%180==0?r.width:r.height)/cur.W,L=tplFs();
  for(let k=L.length-1;k>=0;k--){const f=L[k];if(tplHas(f))continue;
    const bm=bmOf(f),s=sc(f,cur)*ppp,[u,v]=toDisp(f.a,f.b,A),dx=px-u*r.width,dy=py-v*r.height,t=(f.rot+A)*PI/180,
      lx=dx*Math.cos(t)+dy*Math.sin(t),ly=-dx*Math.sin(t)+dy*Math.cos(t);
    if(Math.abs(lx)<=bm.width*s*f.sx/2+14&&Math.abs(ly)<=bm.height*s*f.sy/2+14)return f}
  return null}
function drawTpl(x){
  const L=tplFs();if(!L.length)return;
  const A=ang(cur),cw=ec.width,ch=ec.height,ppp=(A%180==0?cw:ch)/cur.W;
  for(const f of L){if(tplHas(f))continue;
    const bm=bmOf(f),s=sc(f,cur)*ppp,[u,v]=toDisp(f.a,f.b,A),w=bm.width*s*f.sx,h=bm.height*s*f.sy,r=Math.max(11,cw/45);
    x.save();x.translate(u*cw,v*ch);x.rotate((f.rot+A)*PI/180);
    x.globalAlpha=.35;x.drawImage(bm,-w/2,-h/2,w,h);x.globalAlpha=1;
    x.fillStyle="rgba(245,158,11,.14)";x.fillRect(-w/2,-h/2,w,h);
    x.lineWidth=Math.max(2,cw/300);x.strokeStyle="#f59e0b";x.setLineDash([8,6]);x.strokeRect(-w/2,-h/2,w,h);x.setLineDash([]);x.lineWidth=Math.max(4,cw/140);x.beginPath();x.moveTo(-w/2,-h/2);x.lineTo(-w/2,h/2);x.stroke();
    x.fillStyle="#f59e0b";x.beginPath();x.arc(-w/2,-h/2,r,0,7);x.fill();
    x.fillStyle="#fff";x.font="bold "+r*1.2+"px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(f.n,-w/2,-h/2+r*.05);
    x.restore()}}
function tplBar(){
  const b=$("tpb"),L=tplAll();
  if(!cur||!L.length){b.style.display="none";tplSig="";return}
  const cf=(sel&&sel.tf)||tcur,ai=L.indexOf(cf),sig=L.map(f=>tplDone(f)?1:0).join("")+"|"+ai+"|"+L.length;
  if(sig===tplSig&&b.style.display!="none")return;
  tplSig=sig;b.style.display="flex";
  $("tpT").textContent=ai>=0?circ(L[ai].n)+" "+L[ai].str+"  ("+(ai+1)+"/"+L.length+")":"入力欄 "+L.length+"個:タップか「次へ」";
  $("tpN").textContent=ai>=0&&ai>=L.length-1?"入力終了":"次へ ›";
  const c=$("tpn");c.innerHTML="";
  L.forEach((f,k)=>{const e=document.createElement("button");e.className="chip"+(k==ai?" on":"");e.textContent=circ(f.n)+f.str+(tplDone(f)?" ✓":"");e.onclick=()=>tplGo(f);c.appendChild(e)});
  const on=c.querySelector(".on");if(on)c.scrollLeft=on.offsetLeft-c.clientWidth/2+on.offsetWidth/2}
function tplGo(f){
  if(!pages.includes(f.pg))return toast("このページには入力できません");
  const go=()=>{
    tcur=f;setMode("text");
    let it=tplHas(f)?f.it:null,fresh=false;
    if(!it){
      it={k:"t",a:f.a,b:f.b,str:"",s:f.s,c:f.c,rot:f.rot,sx:f.sx,sy:f.sy,tf:f};
      addItem(it);f.it=it;fresh=true}
    sel=it;syncPanel();startEdit(it);
    if(fresh){
      // 入力欄の左端を位置の基準にする:空の入力枠の実寸を測り、枠の左端が入力欄の左端に揃うよう中心をずらす
      const r=ec.getBoundingClientRect(),A=ang(cur),th=f.rot*PI/180,
        d=(tin._w*tin._e*f.sx/(A%180==0?r.width:r.height)-bmOf(f).width*f.s/60*f.sx)/2;
      it.a=f.a+d*Math.cos(th);it.b=f.b+d*Math.sin(th)*cur.W/cur.H;paint()}
    tplBar()};
  endEdit();
  if(cur===f.pg){go();return}
  commit();openEd(f.pg).then(go)}
function tplStep(d){
  const L=tplAll();if(!L.length)return;
  const cf=editing&&editing.tf||(sel&&sel.tf)||tcur,ai=L.indexOf(cf);
  let k;
  if(ai<0){k=L.findIndex(f=>!tplDone(f));if(k<0)k=0;if(d<0)k=0}
  else{k=ai+d;if(k>=L.length){endEdit();tplBar();return toast("入力が終わりました。右上の「完了」で戻れます")}if(k<0)k=0}
  tplGo(L[k])}
$("tpN").onclick=()=>tplStep(1);$("tpP").onclick=()=>tplStep(-1);
async function tplThumb(r,cv){
  try{
    const d=await pdfjsLib.getDocument({data:new Uint8Array(r.pdf)}).promise,p=await d.getPage(1),v=p.view,A=p.rotate%360,
      vp=p.getViewport({scale:150/(A%180==0?v[2]-v[0]:v[3]-v[1])}),x=cv.getContext("2d");
    cv.width=vp.width;cv.height=vp.height;x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);
    await p.render({canvasContext:x,viewport:vp}).promise;
    let n=0;r.fields.forEach(f=>{if(f.type!="input")return;n++;if(f.page)return;
      const [u,w]=toDisp(f.a,f.b,A),rad=Math.max(6,cv.width/14);
      x.fillStyle="#f59e0b";x.beginPath();x.arc(u*cv.width,w*cv.height,rad,0,7);x.fill();
      x.fillStyle="#fff";x.font="bold "+rad*1.3+"px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(n,u*cv.width,w*cv.height)})
  }catch(e){}}
async function tplOpen(r){
  $("tl").style.display="none";
  try{
    snap();say("テンプレートを開いています…");
    const bytes=new Uint8Array(r.pdf),doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise,fi=files.push({name:r.name,bytes,doc})-1,pgs=[],all=[];
    for(let i=0;i<doc.numPages;i++){const p=await doc.getPage(i+1),v=p.view;pgs.push({f:fi,i,r:0,base:p.rotate%360,W:v[2]-v[0],H:v[3]-v[1],sel:false,strokes:[],items:[]})}
    r.fields.forEach(f=>{const pg=pgs[f.page];if(!pg)return;
      if(f.type=="input"){const t={k:"t",a:f.a,b:f.b,str:f.str,s:f.s,c:f.c,rot:f.rot,sx:f.sx,sy:f.sy,n:all.length+1,pg};all.push(t);(pg.tf=pg.tf||[]).push(t)}
      else if(f.str&&f.str.trim())pg.items.push({k:"t",a:f.a,b:f.b,str:f.str,s:f.s,c:f.c,rot:f.rot,sx:f.sx,sy:f.sy})});
    pgs.forEach(p=>p.tfAll=all);
    pages.push(...pgs);draw();say("");
    if(!all.length)return say("「"+r.name+"」を追加しました。入力欄はありません");
    tcur=null;await openEd(all[0].pg);tplGo(all[0]);
    toast("①から入力 →「次へ」で②へ。入力欄の左端から右へ文字が伸びます",4200)
  }catch(e){say("テンプレートを開けませんでした")}}
</script></body></html>
